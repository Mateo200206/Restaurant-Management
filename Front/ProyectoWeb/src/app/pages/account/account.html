<!-- Formulario. From Uiverse.io by Yaya12085 -->
<form class="form" (submit)="onSubmit($event)">
  <h1 class="title">Mi cuenta</h1>

  <label>
    <input class="input" type="text" placeholder=" " [formField]="accountForm.name">
    <span>Nombre del restaurante</span>
  </label>

  <label>
    <textarea class="input" placeholder=" " [formField]="accountForm.description"></textarea>
    <span>Descripción</span>
  </label>

  <label>
    <input class="input" type="url" placeholder=" " [formField]="accountForm.imageUrl">
    <span>URL de imagen</span>
  </label>

  <label>
    <input class="input" type="password" placeholder=" " [formField]="accountForm.password">
    <span>Nueva contraseña</span>
  </label>
  <p class="message">Dejala vacía si no la querés cambiar.</p>

  @if (accountModel().password !== "") {
    <label>
      <input class="input" type="password" placeholder=" " [formField]="accountForm.currentPassword">
      <span>Contraseña actual</span>
    </label>
  }

  <button class="submit" [disabled]="accountForm().invalid()">Guardar cambios</button>
</form>

<section class="form">
  <h2 class="title">Borrar cuenta</h2>
  <p class="message">Se borran también todas tus categorías y productos. No se puede deshacer.</p>
  <button class="submit peligro" type="button" (click)="onDeleteAccount()">Borrar mi cuenta</button>
</section>
