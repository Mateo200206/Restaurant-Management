<!-- Formulario. From Uiverse.io by Yaya12085 -->
<form class="form" (submit)="onLogin($event)">
  <h1 class="title">Iniciar sesión</h1>
  <p class="message">Entrá para administrar la carta de tu restaurante.</p>

  <label>
    <input class="input" type="email" placeholder=" " [formField]="loginForm.email">
    <span>Email</span>
  </label>

  <label>
    <input class="input" type="password" placeholder=" " [formField]="loginForm.password">
    <span>Contraseña</span>
  </label>

  @if (loginError()) {
    <p class="error">Email o contraseña incorrectos</p>
  }

  <button class="submit" [disabled]="loginForm().invalid()">Ingresar</button>
  <p class="signin">¿No tenés cuenta? <a routerLink="/register">Registrate</a></p>
</form>
