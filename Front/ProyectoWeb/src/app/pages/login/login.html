<h1>Iniciar sesión</h1>
<form (submit)="onLogin($event)">
  <label for="email">Email</label>
  <input id="email" type="email" [formField]="loginForm.email">

  <label for="password">Contraseña</label>
  <input id="password" type="password" [formField]="loginForm.password">
    @if (loginError()) {
        <p>Email o contraseña incorrectos</p>
    }
  <button [disabled]="loginForm().invalid()">Ingresar</button>
  <a routerLink="/register">¿No tenes cuenta? Registrate</a>
</form>
