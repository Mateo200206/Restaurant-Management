@if (id()) {
  <h1>Editar producto</h1>
} @else {
  <h1>Nuevo producto</h1>
}

<form (submit)="onSubmit($event)">
  <label for="name">Nombre</label>
  <input id="name" type="text" [formField]="productForm.name">

  <label for="description">Descripción</label>
  <textarea id="description" [formField]="productForm.description"></textarea>

  <label for="price">Precio</label>
  <input id="price" type="number" step="0.01" [formField]="productForm.price">

  <label for="imageUrl">URL de imagen</label>
  <input id="imageUrl" type="url" [formField]="productForm.imageUrl">

  <label for="isFeatured">Destacado</label>
  <input id="isFeatured" type="checkbox" [formField]="productForm.isFeatured">

  <label for="category">Categoría</label>
  <select id="category" [formField]="productForm.categoryId">
    <option value="">Elegí una categoría</option>
    @for (category of categoriesService.myCategories(); track category.id) {
      <option [value]="category.id">{{ category.name }}</option>
    }
  </select>

  @if (id()) {
    <button [disabled]="productForm().invalid()">Guardar Cambios</button>
  } @else {
    <button [disabled]="productForm().invalid()">Crear Producto</button>
  }
</form>
@if (id()) {
    <form (submit)="onSubmitDiscount($event)">
      <h2>Descuento</h2>
      <div class="field">
        <label for="discount">Porcentaje de descuento</label>
        <input id="discount" type="number" [formField]="discountForm.discountPercentage">
      </div>
      <button [disabled]="discountForm().invalid()">Aplicar descuento</button>
    </form>
  }
