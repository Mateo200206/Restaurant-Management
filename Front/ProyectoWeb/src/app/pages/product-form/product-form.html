<!-- Formulario. From Uiverse.io by Yaya12085 -->
<form class="form" (submit)="onSubmit($event)">
  @if (id()) {
    <h1 class="title">Editar producto</h1>
  } @else {
    <h1 class="title">Nuevo producto</h1>
  }

  <label>
    <input class="input" type="text" placeholder=" " [formField]="productForm.name">
    <span>Nombre</span>
  </label>

  <label>
    <textarea class="input" placeholder=" " [formField]="productForm.description"></textarea>
    <span>Descripción (opcional)</span>
  </label>

  <label>
    <input class="input" type="number" step="0.01" placeholder=" " [formField]="productForm.price">
    <span>Precio</span>
  </label>

  <label>
    <input class="input" type="url" placeholder=" " [formField]="productForm.imageUrl">
    <span>URL de imagen (opcional)</span>
  </label>

  <label class="estatico">
    Categoría
    <select [formField]="productForm.categoryId">
      <option value="">Elegí una categoría</option>
      @for (category of categoriesService.myCategories(); track category.id) {
        <option [value]="category.id">{{ category.name }}</option>
      }
    </select>
  </label>

  <label class="field-check">
    <input type="checkbox" [formField]="productForm.isFeatured">
    Destacado
  </label>

  <button class="submit" [disabled]="productForm().invalid()">
    @if (id()) { Guardar cambios } @else { Crear producto }
  </button>
</form>

@if (id()) {
  <form class="form" (submit)="onSubmitDiscount($event)">
    <h2 class="title">Descuento</h2>
    <p class="message">Poné 0 para sacarlo.</p>

    <label>
      <input class="input" type="number" placeholder=" " [formField]="discountForm.discountPercentage">
      <span>Porcentaje de descuento</span>
    </label>

    <button class="submit" [disabled]="discountForm().invalid()">Aplicar descuento</button>
  </form>
}
