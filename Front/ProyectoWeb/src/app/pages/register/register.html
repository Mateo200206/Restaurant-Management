<!-- Formulario. From Uiverse.io by Yaya12085 -->
<form class="form" (submit)="onRegister($event)">
  <h1 class="title">Registrate</h1>
  <p class="message">Creá la cuenta de tu restaurante y armá tu carta digital.</p>

  <label>
    <input class="input" type="text" placeholder=" " [formField]="registerForm.name">
    <span>Nombre del restaurante</span>
  </label>

  <label>
    <input class="input" type="email" placeholder=" " [formField]="registerForm.email">
    <span>Email</span>
  </label>

  <label>
    <input class="input" type="password" placeholder=" " [formField]="registerForm.password">
    <span>Contraseña</span>
  </label>

  <label>
    <input class="input" type="password" placeholder=" " [formField]="registerForm.password2">
    <span>Repetir contraseña</span>
  </label>
  @if (registerForm.password2().invalid() && registerModel().password2 !== "") {
    <p class="error">Las contraseñas no coinciden</p>
  }

  <label>
    <textarea class="input" placeholder=" " [formField]="registerForm.description"></textarea>
    <span>Descripción (opcional)</span>
  </label>

  <label>
    <input class="input" type="url" placeholder=" " [formField]="registerForm.imageUrl">
    <span>URL de imagen (opcional)</span>
  </label>

  @if (registerError()) {
    <p class="error">Revisá haber completado bien todos los campos.</p>
  }

  <button class="submit" [disabled]="registerForm().invalid()">Registrarse</button>
  <p class="signin">¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a></p>
</form>
