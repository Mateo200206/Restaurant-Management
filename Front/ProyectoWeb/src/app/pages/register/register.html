<h1>Registrate</h1>
<form (submit)="onRegister($event)">

  <label for="email">Email</label>
  <input id="email" type="email" [formField]="registerForm.email">

  <label for="password">Contraseña</label>
  <input id="password" type="password" [formField]="registerForm.password">

  <label for="name">Nombre</label>
  <input id="name" type="text" [formField]="registerForm.name">

  <label for="description">Descripcion</label>
  <textarea id="description" [formField]="registerForm.description"></textarea>

  <label for="image">URL Imagen</label>
  <input id="image" type="url" [formField]="registerForm.imageUrl">

    @if (registerError()) {
        <p>Verifique haber completado correctamente todos los campos.</p>
    }
  <button [disabled]="registerForm().invalid()">Registrarse</button>
  <a routerLink="/login">¿Ya tenés cuenta? Iniciá sesión</a>
</form>
